name: Android UI Tests (Appium)

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Appium and uiautomator2
        run: |
          npm install -g appium@3.1.0
          appium driver uninstall uiautomator2 || true
          appium driver install uiautomator2@6.0.0
          appium driver list

      - name: Start Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          profile: pixel_5
          script: |
            echo "Emulator started"
      
      - name: Start Appium server
        run: |
          appium --log-level info > appium.log 2>&1 &
          sleep 15

      - name: Wait for device to be ready
        run: |
          adb wait-for-device
          adb shell 'until [[ "$(getprop sys.boot_completed)" == "1" ]]; do sleep 5; done'
          adb shell input keyevent 82
          adb devices

      
      - name: Run UI tests
        run: pytest -v --alluredir=allure-results

      - name: Install Allure
        if: always()
        run: |
          sudo apt-get update
          sudo apt-get install -y allure

      - name: Generate Allure report
        if: always()
        run: |
          allure generate allure-results -o allure-report --clean

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
